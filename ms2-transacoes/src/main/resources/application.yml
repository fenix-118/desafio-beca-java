server:
  port: 8082

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: ms2-transacoes
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/transacoes_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    hibernate:
      # O esquema vem das migrações do Flyway (db/migration); o Hibernate só confere se as entidades batem.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Banco que já tinha as tabelas (criadas pelo antigo ddl-auto: update): marca a V1 como aplicada sem rodá-la.
    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health

# MS1 (usuários): no Compose, MS1_BASE_URL aponta para o nome do serviço.
ms1:
  base-url: ${MS1_BASE_URL:http://localhost:8081}
  timeout-ms: 2000
  # Mesmo SERVICO_TOKEN do MS1: identifica o MS2 ao consultar usuários.
  token-servico: ${SERVICO_TOKEN:}

# API Mock (contas): a URL fica só no .env (MOCKAPI_BASE_URL), nunca no código.
mockapi:
  base-url: ${MOCKAPI_BASE_URL:}
  timeout-ms: 2000

# BrasilAPI (câmbio): API pública, sem chave; BRASILAPI_BASE_URL permite apontar para outro endereço.
brasilapi:
  base-url: ${BRASILAPI_BASE_URL:https://brasilapi.com.br/api}
  timeout-ms: 2000
  # Depois de uma falha de conexão, a BrasilAPI não é chamada por este tempo (a conversão sai indisponível na hora).
  pausa-apos-falha-segundos: 300
