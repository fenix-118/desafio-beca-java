server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: ms1-usuarios
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/usuarios_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

servico:
  # Token que o MS2 manda em X-Servico-Token para consultar usuários (GET /usuarios/{id}). Fica só no .env.
  token: ${SERVICO_TOKEN:}
